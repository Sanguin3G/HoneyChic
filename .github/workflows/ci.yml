name: HoneyChic CI

on:
  push:
    branches: [rewrite/honeychic-v2, main]
  pull_request:
    branches: [rewrite/honeychic-v2, main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: honeychic
          POSTGRES_USER: honeychic
          POSTGRES_PASSWORD: honeychic_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U honeychic -d honeychic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: honeychic
      DB_PASSWORD: honeychic_ci
      DB_DATABASE: honeychic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure local build environment
        run: |
          cp .env.example .env
          node ace generate:key
      - run: node ace migration:run
      - run: node ace db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Create isolated test database
        run: PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -U "$DB_USER" honeychic_test
      - run: npm test
        env:
          DB_DATABASE: honeychic_test
          LIMITER_STORE: memory
