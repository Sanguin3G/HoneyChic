name: honeychic-production
services:
  app:
    build: .
    image: honeychic:production
    restart: unless-stopped
    env_file: .env.production
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      DB_HOST: postgres
    ports:
      - "127.0.0.1:${PORT:-3333}:${PORT:-3333}"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-honeychic}
      POSTGRES_USER: ${DB_USER:-honeychic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a production database password}
    volumes:
      - postgres-production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-production:
