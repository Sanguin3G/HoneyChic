name: honeychic

services:
  postgres:
    image: postgres:17-alpine
    container_name: honeychic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-honeychic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-honeychic_local}
      POSTGRES_DB: ${DB_DATABASE:-honeychic}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.29
    container_name: honeychic-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres_data:
